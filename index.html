<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232B4BA8'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' fill='%23fff' text-anchor='middle'%3EEn%3C/text%3E%3C/svg%3E">
<title>Тренажёр английской грамматики</title>
<script>
/* тема до первой отрисовки, чтобы не моргало светлым */
(function(){ var t='dark';
  try{ var s=JSON.parse(localStorage.getItem('en2-trainer-v3')||'null'); if(s&&s.theme) t=s.theme; }catch(e){}   /* тот же ключ, что KEY в boot() */
  if(t!=='auto') document.documentElement.setAttribute('data-theme',t);
})();
</script>
<style>
/* ==================================================================
   ТОКЕНЫ. Мир: модульная идентика — тихий деловой гротеск,
   поверх которого работают крупные цветные полосы. Цвет кодирует
   смысл (тема задания, вердикт) и никогда не украшает.
   ================================================================== */
:root{
  /* --- светлая тема: холодный серый как земля, не белизна --- */
  --bg:#F1F3F5; --surface:#FFFFFF; --surface-2:#E5E8EC;
  --ink:#0F1216; --muted:#555D68; --faint:#666D7A;
  --line:#D5DAE0; --line-strong:#B4BCC6;

  /* цветовой код: как блок — яркий вариант с тёмным текстом,
     как текст — затемнённый вариант                                */
  --verb:#00B8D9;      --verb-ink:#046C80;
  --article:#FFD400;   --article-ink:#7A6100;
  --pronoun:#F0439B;   --pronoun-ink:#A3106A;
  --ok:#2FC26B;        --ok-ink:#15703C;
  --bad:#FF4438;       --bad-ink:#B01B10;
  --on-color:#0F1216;                 /* текст поверх цветного блока */

  --action:#0F1216; --action-ink:#FFFFFF;   /* главная кнопка — плашка чернил */
  color-scheme:light;

  /* --- шкала отступов, шаг 4px --- */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --s6:32px; --s7:48px; --s8:64px; --s9:96px;

  /* --- типографика: одна гарнитура, фиксированная rem-шкала --- */
  --t1:.6875rem; --t2:.75rem; --t3:.8125rem; --t4:.875rem;
  --t5:1rem; --t6:1.125rem; --t7:1.375rem; --t8:1.75rem;
  --lh-tight:1.25; --lh-body:1.55; --lh-read:1.6;
  --sans:"Helvetica Neue",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Arial,sans-serif;

  /* --- форма: мир из жёстких блоков, скруглений нет --- */
  --r:0px;
  --band:10px;         /* высота полосы темы */
  --band-2:6px;        /* высота полосы вердикта */

  /* --- движение: блоки встают на место, а не выплывают --- */
  --dur1:120ms; --dur2:180ms; --dur3:240ms;
  --ease:cubic-bezier(.2,.8,.2,1);

  /* --- раскладка --- */
  --measure:720px;
  --item-reserve:90px;   /* замер: блок задания бывает 45 / 75 / 90px */
  --gutter:max(var(--s5), env(safe-area-inset-left));
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1013; --surface:#15181D; --surface-2:#1D2128;
  --ink:#F0F2F5; --muted:#A3ABB6; --faint:#79828F;
  --line:#252A32; --line-strong:#39404A;
  --verb:#22D3EE;      --verb-ink:#22D3EE;
  --article:#FDE047;   --article-ink:#FDE047;
  --pronoun:#F865AE;   --pronoun-ink:#F865AE;
  --ok:#4ADE80;        --ok-ink:#4ADE80;
  --bad:#FF7043;       --bad-ink:#FF7043;
  --on-color:#0E1013;
  --action:#F0F2F5; --action-ink:#0E1013;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1013; --surface:#15181D; --surface-2:#1D2128;
    --ink:#F0F2F5; --muted:#A3ABB6; --faint:#79828F;
    --line:#252A32; --line-strong:#39404A;
    --verb:#22D3EE;      --verb-ink:#22D3EE;
    --article:#FDE047;   --article-ink:#FDE047;
    --pronoun:#F865AE;   --pronoun-ink:#F865AE;
    --ok:#4ADE80;        --ok-ink:#4ADE80;
    --bad:#FF7043;       --bad-ink:#FF7043;
    --on-color:#0E1013;
    --action:#F0F2F5; --action-ink:#0E1013;
  }
}
/* цвет текущей темы задания — им красится пропуск, фокус и каретка */
body{--topic:var(--verb); --topic-ink:var(--verb-ink)}
body[data-topic="article"]{--topic:var(--article); --topic-ink:var(--article-ink)}
body[data-topic="pronoun"]{--topic:var(--pronoun); --topic-ink:var(--pronoun-ink)}

/* ============================== база ============================== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:var(--t5); line-height:var(--lh-body);
  -webkit-font-smoothing:antialiased; letter-spacing:-.006em;
  min-height:100dvh; display:flex; flex-direction:column;
}
[hidden]{display:none!important}
::selection{background:var(--topic); color:var(--on-color)}
:focus-visible{outline:2px solid var(--topic); outline-offset:2px; border-radius:0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-strong); border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
button, input{
  font:inherit; color:inherit; appearance:none; -webkit-appearance:none;
  background-color:transparent; border-radius:0;
}
svg{display:block}

/* ============================== шапка ============================== */
.bar{
  display:flex; align-items:center; gap:var(--s4);
  padding:var(--s3) var(--gutter);
  background:var(--surface); border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:20;
}
.brand{display:flex; align-items:center; gap:var(--s2); white-space:nowrap}
.mark{display:flex; gap:2px}
.mark i{width:6px; height:16px; display:block}
.mark i:nth-child(1){background:var(--verb)}
.mark i:nth-child(2){background:var(--article)}
.mark i:nth-child(3){background:var(--pronoun)}
.brand-name{
  font-size:var(--t2); font-weight:600; letter-spacing:.08em; text-transform:uppercase;
}
.spacer{flex:1}
.stats{
  display:flex; align-items:baseline; gap:var(--s4);
  font-size:var(--t2); color:var(--muted); font-variant-numeric:tabular-nums;
  letter-spacing:.04em; text-transform:uppercase;
}
.stats b{color:var(--ink); font-weight:600}
.stats .sep{width:1px; height:12px; background:var(--line); align-self:center}
.streak{display:inline-flex; align-items:center; gap:var(--s1)}
.streak.hot{color:var(--ok-ink)}
.iconbtn{
  display:grid; place-items:center; width:32px; height:32px; padding:0;
  background:transparent; border:1px solid transparent; color:var(--muted); cursor:pointer;
  transition:background var(--dur1) var(--ease), color var(--dur1) var(--ease);
}
.iconbtn:hover{background:var(--surface-2); color:var(--ink)}
.iconbtn[aria-expanded="true"]{background:var(--ink); color:var(--bg)}

/* ============ полосы: подпись системы ============ */
.bands{display:block; background:var(--surface); border-bottom:1px solid var(--line)}
.bands.reset, .bands.reset *{transition:none!important}
.bands .brow{display:flex; height:var(--band)}
.bands .brow i{flex:1; transition:flex-grow var(--dur1) var(--ease), opacity var(--dur1) var(--ease); opacity:.32}
.bands .brow i[data-topic="verb"]{background:var(--verb)}
.bands .brow i[data-topic="article"]{background:var(--article)}
.bands .brow i[data-topic="pronoun"]{background:var(--pronoun)}
body[data-topic="verb"]    .bands i[data-topic="verb"],
body[data-topic="article"] .bands i[data-topic="article"],
body[data-topic="pronoun"] .bands i[data-topic="pronoun"]{flex-grow:6; opacity:1}
/* полоса раунда: один блок — одно задание, вся сессия видна целиком */
.bands .steps{display:flex; gap:2px; height:var(--band-2)}
.bands .steps i{flex:1; background:var(--surface-2); transition:background var(--dur1) var(--ease)}
.bands .steps i.ok{background:var(--ok)}
.bands .steps i.bad{background:var(--bad)}
.bands .steps i.now{background:var(--topic)}

/* ============================== настройки ============================== */
.panel{
  background:var(--surface); border-bottom:1px solid var(--line);
  padding:var(--s5) var(--gutter) var(--s6);
  animation:drop var(--dur2) var(--ease);
}
@keyframes drop{from{opacity:0; transform:translateY(-6px)}}
.panel-in{max-width:var(--measure); margin:0 auto; display:grid; gap:var(--s5)}
.row{display:flex; flex-wrap:wrap; align-items:flex-start; gap:var(--s2)}
.row-label{
  font-size:var(--t1); letter-spacing:.12em; text-transform:uppercase;
  color:var(--faint); width:104px; flex:none; padding-top:var(--s2);
}
.chip{
  padding:var(--s2) var(--s3); border:1px solid var(--line-strong); background:transparent;
  color:var(--muted); font-size:var(--t2); letter-spacing:.03em; cursor:pointer; text-align:center;
  transition:background var(--dur1) var(--ease), color var(--dur1) var(--ease), border-color var(--dur1) var(--ease);
}
.chip:hover{border-color:var(--ink); color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--bg); font-weight:600}
/* тематические чипы носят свой цвет кода */
.row[data-group="topics"] .chip[data-key="verb"][aria-pressed="true"]{background:var(--verb); border-color:var(--verb); color:var(--on-color)}
.row[data-group="topics"] .chip[data-key="article"][aria-pressed="true"]{background:var(--article); border-color:var(--article); color:var(--on-color)}
.row[data-group="topics"] .chip[data-key="pronoun"][aria-pressed="true"]{background:var(--pronoun); border-color:var(--pronoun); color:var(--on-color)}
.chip.locked{animation:nudge var(--dur3) var(--ease)}
@keyframes nudge{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.tenses{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:1px; flex:1; min-width:0; background:var(--line)}
.tenses .chip{border:0; padding:var(--s2); font-size:var(--t1); letter-spacing:.05em; color:var(--faint)}
/* двенадцать клеток — тихая заливка: иерархия темы > формы > времена */
.tenses .chip[aria-pressed="true"]{background:var(--line-strong); color:var(--ink); font-weight:600}
.panel .link{
  background:none; border:none; padding:var(--s2) 0; color:var(--muted); font-size:var(--t2);
  letter-spacing:.03em; text-decoration:underline; text-underline-offset:3px;
  text-decoration-color:var(--line-strong); cursor:pointer;
}
.panel .link:hover{color:var(--bad-ink); text-decoration-color:currentColor}

/* ============================== задание ============================== */
main{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  padding:clamp(var(--s7), 11vh, var(--s9)) var(--gutter) var(--s7);
}
.stage{width:100%; max-width:var(--measure)}
.item{display:grid; gap:var(--s3); align-content:start;
      min-height:var(--item-reserve); margin-bottom:var(--s6)}
/* единственный авторский момент — появление разбора; сдвига нет, только проявление */
@keyframes enter{from{opacity:0}}
.sentence{
  margin:0; font-size:var(--t8); line-height:var(--lh-read);
  letter-spacing:-.022em; font-weight:500;
}
.hint{color:var(--faint); font-size:.62em; letter-spacing:.02em; font-weight:400; white-space:nowrap}
.subhint{margin:0; font-size:var(--t2); color:var(--faint); letter-spacing:.03em}
.blank{
  font:inherit; font-weight:600; color:var(--topic-ink);
  background:transparent; border:0; border-bottom:3px solid var(--topic);
  padding:0 .14em 2px; margin:0 .08em; text-align:center;
  caret-color:var(--topic); line-height:1.2; vertical-align:baseline;
  /* правило 5: ширина одинакова у всех пропусков и не зависит от ответа.
     Без field-sizing — единые 15ch, чтобы влезала самая длинная форма. */
  width:15ch; min-width:15ch;
  transition:background var(--dur1) var(--ease), color var(--dur1) var(--ease), border-color var(--dur1) var(--ease);
}
/* где есть field-sizing — стартовая ширина одна и сидит на шкале отступов,
   а растёт поле только от того, что печатает человек */
@supports (field-sizing:content){
  .blank{field-sizing:content; width:auto; min-width:var(--s9); max-width:100%}
}
.blank:hover:not(:disabled){background:var(--surface-2)}
.blank:focus{outline:none; background:var(--surface-2)}
.blank:disabled{opacity:1; -webkit-text-fill-color:currentColor}
/* вердикт: верный ответ заливается блоком, ошибка остаётся тихой —
   награда громче наказания */
.blank.ok{background:var(--ok); border-bottom-color:var(--ok); color:var(--on-color); -webkit-text-fill-color:var(--on-color)}
.blank.bad{background:transparent; border-bottom-color:var(--bad); color:var(--bad-ink); -webkit-text-fill-color:var(--bad-ink); text-decoration:line-through; text-decoration-thickness:2px}
.blank.retry{color:var(--bad-ink); -webkit-text-fill-color:var(--bad-ink); border-bottom-color:var(--bad)}
.blank.empty{animation:nudge var(--dur3) var(--ease); border-bottom-color:var(--bad)}

/* ============================== разбор ============================== */
.fb:not(:empty){margin-top:var(--s6)}
.verdict{display:grid; gap:var(--s3); justify-items:start; animation:enter var(--dur1) var(--ease) both}
.mark-v{
  display:inline-block; padding:var(--s1) var(--s3); font-size:var(--t1); font-weight:700;
  letter-spacing:.12em; text-transform:uppercase; color:var(--on-color);
}
.mark-v.ok{background:var(--ok)}
.mark-v.bad{background:var(--bad)}
.mark-v.try{background:var(--article)}
/* маркер, на который просят посмотреть: жёлтый — это внимание, а не наказание */
.mk{background:var(--article); color:var(--on-color); padding:0 .1em}
.mark-v.gh{background:var(--surface-2); color:var(--muted)}
.answer{margin:0; font-size:var(--t6); line-height:var(--lh-body); color:var(--ink); font-weight:400}
.answer .fill{font-weight:700; color:var(--ok-ink); box-shadow:inset 0 -.42em 0 -.06em color-mix(in srgb, var(--ok) 28%, transparent)}
/* нулевой артикль — не пустое место, а знак: иначе 30 пропусков из 98 в разборе не видны */
.fill.zero{display:inline-block; width:20px; height:3px; vertical-align:.34em; background:var(--ok-ink); box-shadow:none}
.tag{
  display:inline-block; padding:var(--s1) var(--s3); background:var(--article); color:var(--on-color);
  font-size:var(--t1); font-weight:700; letter-spacing:.1em; text-transform:uppercase;
}
.note{margin:0; font-size:var(--t4); line-height:var(--lh-body); color:var(--muted); max-width:62ch}
.note b{color:var(--ink); font-weight:700}

/* ============================== итог раунда ============================== */
.result{display:grid; gap:var(--s4); justify-items:start; animation:enter var(--dur2) var(--ease) both}
.rbig{margin:0; font-size:var(--t8); line-height:1.1; font-weight:500; letter-spacing:-.022em}
.rbig b{font-weight:700}
.rbreak{list-style:none; margin:0; padding:0; display:grid; gap:var(--s3); width:100%; max-width:440px}
.rbreak li{display:grid; grid-template-columns:1fr auto; gap:var(--s1) var(--s4); align-items:baseline; font-size:var(--t3)}
.rbreak li span{color:var(--muted)}
.rbreak li b{font-weight:700; font-variant-numeric:tabular-nums}
.rbreak li i{grid-column:1 / -1; height:4px; background:var(--surface-2)}
.rbreak li i::before{content:''; display:block; height:100%; width:var(--p); background:var(--ok)}
.result .actions{margin-top:var(--s3)}

/* ============================== действия ============================== */
.actions{display:flex; align-items:center; gap:var(--s2)}
.btn{
  appearance:none; -webkit-appearance:none; display:inline-flex; align-items:center; gap:var(--s2);
  padding:var(--s3) var(--s5); border:1px solid var(--action); background:var(--action);
  color:var(--action-ink); font-size:var(--t3); font-weight:600; letter-spacing:.04em;
  text-transform:uppercase; cursor:pointer;
  transition:filter var(--dur1) var(--ease), transform 60ms var(--ease);
}
.btn:hover{filter:brightness(.88)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line-strong); font-weight:500}
.btn.ghost:hover{border-color:var(--ink); filter:none}
.keys{margin:var(--s5) 0 0; font-size:var(--t2); color:var(--faint); letter-spacing:.02em}
.keys kbd{
  font:inherit; font-size:var(--t1); font-weight:600; background:var(--surface-2);
  border:1px solid var(--line); padding:2px 6px; color:var(--muted);
}

/* ============================== работа над ошибками ============================== */
.log{background:var(--surface); border-top:1px solid var(--line)}
.log-in{max-width:calc(var(--measure) + 2 * var(--gutter)); margin:0 auto; padding:0 var(--gutter) var(--s3)}
.log summary{
  list-style:none; cursor:pointer; padding:var(--s4) 0; font-size:var(--t2); color:var(--muted);
  letter-spacing:.06em; text-transform:uppercase; display:flex; align-items:center; gap:var(--s2);
}
.log summary::-webkit-details-marker{display:none}
.log summary svg{transition:transform var(--dur2) var(--ease)}
.log details[open] summary svg{transform:rotate(90deg)}
.log summary b{color:var(--ink); font-weight:700}
.log ul{list-style:none; margin:0; padding:0 0 var(--s5); display:grid; gap:var(--s5)}
.log li{display:grid; gap:var(--s2)}
.log li::before{content:''; display:block; width:20px; height:4px; background:var(--line-strong)}
.log li[data-topic="verb"]::before{background:var(--verb)}
.log li[data-topic="article"]::before{background:var(--article)}
.log li[data-topic="pronoun"]::before{background:var(--pronoun)}
.log .s{font-size:var(--t5); line-height:var(--lh-body)}
.log .s .fill{font-weight:700; color:var(--ok-ink)}
.log .yours{font-size:var(--t2); color:var(--muted)}
.log .yours s{color:var(--bad-ink); text-decoration-thickness:2px}

/* ============================== адаптация ============================== */
@media (max-width:900px){ .brand-name{display:none} }
@media (max-width:720px){
  :root{ --gutter:max(var(--s4), env(safe-area-inset-left)); --band:8px; --band-2:5px; --item-reserve:154px }   /* самое длинное предложение на узком экране */
  .sentence{font-size:var(--t7); line-height:1.75}
  main{padding-top:var(--s6); padding-bottom:var(--s6)}
  .stats{font-size:var(--t1); gap:var(--s3)}
  .row-label{width:100%; padding-top:0}
  .tenses{grid-template-columns:repeat(2, minmax(0,1fr))}
  .answer{font-size:var(--t5)}
  .keys{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important; transition-duration:.001ms!important}
}
</style>
</head>
<body>

<header class="bar">
  <span class="brand">
    <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="brand-name">Тренажёр английской грамматики</span>
  </span>
  <span class="spacer"></span>
  <div class="stats" aria-live="off">
    <span><b id="stCorrect">0</b> / <b id="stTotal">0</b></span>
    <span class="sep"></span>
    <span id="stAcc">—</span>
    <span class="sep"></span>
    <span class="streak" id="stStreakWrap">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3c.5 3-1.5 4.5-3 6s-3 3-3 5.5A5 5 0 0 0 12 20a5 5 0 0 0 5-5.5c0-2-1-3.5-2-4.5.2 1.6-.6 2.5-1.5 2.8.4-2.6-.2-7.3-.5-9.8z"/></svg>
      <b id="stStreak">0</b>
    </span>
  </div>

  if(v==='be') return 'being';

}

/* краткие формы: полная и краткая равнозначны в обе стороны */
const CONTR_POS = {am:"'m", is:"'s", are:"'re", has:"'s", have:"'ve", had:"'d", will:"'ll"};
const CONTR_NEG = {is:"isn't", are:"aren't", was:"wasn't", were:"weren't",
                   has:"hasn't", have:"haven't", had:"hadn't", will:"won't",
                   do:"don't", does:"doesn't", did:"didn't"};
function affAnswers(w){
  const out = [w.join(' ')];
  if(w.length > 1 && CONTR_POS[w[0]]) out.push(CONTR_POS[w[0]] + ' ' + w.slice(1).join(' '));
  return out;
}
function negAnswers(w){
  const a = w[0], r = w.slice(1).join(' '), tail = r ? ' ' + r : '';
  const out = [];
  if(a === 'am') out.push("'m not" + tail, 'am not' + tail);
  else {
    if(CONTR_NEG[a]) out.push(CONTR_NEG[a] + tail);
    out.push(a + ' not' + tail);
    if(CONTR_POS[a]) out.push(CONTR_POS[a] + ' not' + tail);
  }
  return out;
}

/* полная группа глагола: массив слов, первое — вспомогательный */
function phraseFor(v, tense, agr){
  const b = v.b;
  const third = v.th || thirdPerson(b);
  const past  = v.p  || pastRegular(b, v.dbl);
  const pp    = v.pp || past;
  const ing   = ingForm(b, v.dbl);
  const hv    = agr === '3' ? 'has' : 'have';
  switch(tense){
    case 'pres':   return {aff:[agr==='3' ? third : b], doAux: agr==='3' ? 'does' : 'do', base:[b]};
    case 'past':   return {aff:[past], doAux:'did', base:[b]};
    case 'fut':    return {aff:['will', b]};
    case 'presC':  return {aff:[beForm(agr), ing]};
    case 'pastC':  return {aff:[bePast(agr), ing]};
    case 'futC':   return {aff:['will','be', ing]};
    case 'presP':  return {aff:[hv, pp]};
    case 'pastP':  return {aff:['had', pp]};
    case 'futP':   return {aff:['will','have', pp]};
    case 'presPC': return {aff:[hv,'been', ing]};
    case 'pastPC': return {aff:['had','been', ing]};
    case 'futPC':  return {aff:['will','have','been', ing]};
  }
}
function bePhraseFor(tense, agr){
  switch(tense){
    case 'pres':  return {aff:[beForm(agr)]};
    case 'past':  return {aff:[bePast(agr)]};
    case 'fut':   return {aff:['will','be']};
    case 'presP': return {aff:[agr==='3' ? 'has' : 'have','been']};
    case 'pastP': return {aff:['had','been']};
    case 'futP':  return {aff:['will','have','been']};
  }
}
const BE_TENSES = ['pres','past','fut','presP','pastP','futP'];

/* ================== пояснение ================== */
function formNote(v, tense, agr){
  const b = v.b;
  if(b === 'be') return '';
  const past = v.p || pastRegular(b, v.dbl);
  const pp   = v.pp || past;
  if(isCont(tense)){
    const r = ruleIng(b, v.dbl);
    return '<b>' + b + ' → ' + ingForm(b, v.dbl) + '</b>' + (r ? ' — ' + r : '') + '. ';
  }
  if(isPerf(tense)){
    return v.p ? '<b>' + b + ' → ' + past + ' → ' + pp + '</b> — неправильный глагол. '
               : '<b>' + b + ' → ' + pp + '</b> — правильный глагол, третья форма совпадает со второй'
                 + (rulePast(b, v.dbl) ? ', ' + rulePast(b, v.dbl) : '') + '. ';
  }
  if(tense === 'pres' && agr === '3'){
    const third = v.th || thirdPerson(b);
    return '<b>' + b + ' → ' + third + '</b>' + (ruleThird(b) ? ' — ' + ruleThird(b) : '') + '. ';
  }
  if(tense === 'pres'){
    return 'С I / you / we / they глагол остаётся в начальной форме — <b>' + b + '</b>. ';
  }
  if(tense === 'past'){
    return v.p ? '<b>' + b + ' → ' + past + '</b> — неправильный глагол'
                 + (past === b ? ' (пишется так же, читается иначе)' : '') + '. '
               : '<b>' + b + ' → ' + past + '</b>'
                 + (rulePast(b, v.dbl) ? ', ' + rulePast(b, v.dbl) : '') + '. ';
  }
  return '';
}

/* ================== разбор написанного ==================
   Движок умеет собрать все 36 клеток «время × форма» для того же глагола
   и того же лица, поэтому может узнать, какую форму человек написал на
   самом деле. Говорим при этом маркерами, а не метками времён: до конца
   попыток метка «Past Simple» появляться не должна. */
function diagnoseVerb(input, dx){
  const a = normAns(input);
  if(!a) return [];
  const mk = dx.be ? (t,agr) => bePhraseFor(t,agr) : (t,agr) => phraseFor(dx.v,t,agr);
  const hits = [];
  TENSES_ALL.forEach(t=>{
    const p = mk(t, dx.agr);
    if(!p) return;
    if(affAnswers(p.aff).some(x => normAns(x) === a)) hits.push({tense:t, form:'aff'});
    const neg = p.doAux ? negAnswers([p.doAux].concat(p.base)) : negAnswers(p.aff);
    if(neg.some(x => normAns(x) === a)) hits.push({tense:t, form:'neg'});
  });
  return hits;
}
/* примеры маркеров того времени, которое человек написал по ошибке */
function markerHints(dx, t){
  const list = dx.be ? (MARK_BE[t] || [])
             : (dx.v && dx.v.st && MARK_ST[t]) ? MARK_ST[t] : (MARK[t] || []);
  return list.slice(0, 2);
}
const PK_HINT = {s:'личную форму — она отвечает на «кто?»',
                 p:'притяжательную форму — она отвечает на «чей?»',
                 o:'объектную форму — она отвечает на «кого / кому?»'};
function diagnosePron(input, dx){
  const a = normAns(input), hits = [];
  ['s','p','o'].forEach(k=>{ if(normAns(dx.pr[k]) === a) hits.push(k); });
  return hits;
}

/* ================== сборка задания ================== */
const T = s => ({t:'text', v:s});
const B = (ans,hint) => ({t:'blank', a:ans, hint:hint||''});

function markerFor(v, tense, be){
  if(be && MARK_BE[tense]) return pick(MARK_BE[tense]);
  if(!be && v.st && MARK_ST[tense]) return pick(MARK_ST[tense]);
  return pick(MARK[tense]);
}

function makeVerbItem(cfg){
  const tense = pick(cfg.tenses), form = pick(cfg.forms);

  /* какие глаголы вообще возможны в этом времени */
  let be = false, v = null;
  if(isPerfCont(tense)){
    v = pick(VERBS.filter(x => x.dur));
  }else if(isCont(tense)){
    v = pick(VERBS.filter(x => !x.noCont && !x.st));   /* глаголы состояния не бывают в Continuous */
  }else if(BE_TENSES.indexOf(tense) >= 0 && Math.random() < 0.11){
    be = true;
  }else if(tense === 'pastP' || tense === 'futP'){
    v = pick(VERBS.filter(x => !x.noPerf));            /* «will have wanted» звучит неестественно */
  }else{
    v = pick(VERBS);
  }

  const s = pick(SUBJ);
  let pool = be ? BE.c : v.c;
  if(form !== 'aff') pool = pool.filter(x => !/\bnothing\b/.test(x));   /* без двойного отрицания */
  if(tense !== 'pres' && tense !== 'past' && tense !== 'fut')             /* «work at nine» спорит с маркером */
    pool = pool.filter(x => !/\bat (five|six|seven|eight|nine|ten|eleven)\b/.test(x));
  const comp = pick(pool.length ? pool : (be ? BE.c : v.c));
  const mark = markerFor(v || {}, tense, be);
  const tag  = TENSE_RU[tense] + ' · ' + FORM_RU[form];
  /* label — для разбивки в итоге раунда, sk — машинные ключи правила:
     по ним считается освоенность, по подписи считать нельзя */
  const label = TENSE_RU[tense];
  const sk = ['v:' + tense + ':' + form, 'm:' + (be ? 'be' : v.b)];
  /* dx — всё, что нужно, чтобы потом узнать написанную форму; marker — куда смотреть */
  const dx = {kind:'verb', be:be, v:v, agr:s.a, tense:tense, form:form};
  const hintWord = be ? 'be' : v.b;

  const mk = be ? (t,agr) => bePhraseFor(t,agr) : (t,agr) => phraseFor(v,t,agr);
  const p  = mk(tense, s.a);
  const tail = (comp ? ' ' + comp : '') + ' ' + mark;

  /* --- утверждение --- */
  if(form === 'aff'){
    return {topic:'verb', tag, label, sk, dx, marker:mark,
      parts:[T(s.t + ' '), B(affAnswers(p.aff).concat(v && v.altIng && isCont(tense) ? [p.aff.slice(0,-1).concat(v.altIng[0]).join(' ')] : [])
                             .concat(v && v.alt && tense === 'past' ? v.alt : []), hintWord),
             T(tail + '.')],
      note: be
        ? TENSE_RU[tense] + ': ' + FORMULA_BE[tense] + '. Здесь — <b>' + p.aff.join(' ') + '</b>. ' + WHEN_RU[tense]
        : TENSE_RU[tense] + ': ' + FORMULA[tense] + '. ' + formNote(v, tense, s.a) + WHEN_RU[tense]};
  }

  /* --- отрицание --- */
  if(form === 'neg'){
    const words = p.doAux ? [p.doAux].concat(p.base) : p.aff;
    const note = p.doAux
      ? 'Отрицание в ' + TENSE_RU[tense] + ': <b>' + p.doAux + ' not (' + CONTR_NEG[p.doAux]
        + ') + начальная форма</b>. Время уже во вспомогательном глаголе, поэтому сам глагол не меняется — <b>'
        + CONTR_NEG[p.doAux] + ' ' + v.b + '</b>.'
      : 'Отрицание в ' + TENSE_RU[tense] + ': <b>not</b> ставится после первого вспомогательного глагола — <b>'
        + negAnswers(p.aff)[0] + '</b>. Никаких do / does / did: вспомогательный уже есть.';
    return {topic:'verb', tag, label, sk, dx, marker:mark,
      parts:[T(s.t + ' '), B(negAnswers(words), 'not / ' + hintWord), T(tail + '.')],
      note};
  }

  /* --- вопрос --- */
  if(p.doAux){
    const aux = cap(p.doAux);
    return {topic:'verb', tag, label, sk, dx, marker:mark,
      parts:[B([aux], ''), T(' ' + s.l + ' '), B([v.b], hintWord), T(tail + '?')],
      note:'Вопрос в ' + TENSE_RU[tense] + ': <b>' + aux + ' + подлежащее + начальная форма</b>. '
           + (p.aff[0] === v.b
              ? 'С I / you / we / they — <b>Do</b>, с he / she / it — <b>Does</b>.'
              : 'Окончание и время уходят во вспомогательный: не «' + aux + ' ' + s.l + ' ' + p.aff[0]
                + '», а <b>' + aux + ' ' + s.l + ' ' + v.b + '</b>.')};
  }
  const aux = cap(p.aff[0]), rest = p.aff.slice(1).join(' ');
  const qNote = 'Вопрос в ' + TENSE_RU[tense] + ': первый вспомогательный глагол выходит перед подлежащим — <b>'
              + aux + ' ' + s.l + (rest ? ' ' + rest : '') + ' …?</b>' + (be && !rest ? ' Никаких do / does / did.' : '');
  if(!rest){
    return {topic:'verb', tag, label, sk, dx, marker:mark,
      parts:[B([aux], hintWord), T(' ' + s.l + tail + '?')], note:qNote};
  }
  return {topic:'verb', tag, label, sk, dx, marker:mark,
    parts:[B([aux], ''), T(' ' + s.l + ' '), B([rest], hintWord), T(tail + '?')], note:qNote};
}

/* ==================================================================
   2. Местоимения: I — my — me
   ================================================================== */
/* ru — подсказка в скобках. По-русски, а не по-английски: английская форма
   в скобках у трети заданий совпадала бы с ответом слово в слово. */
const PRON = [
  {s:'I',   p:'my',   o:'me',   a:'i',  ru:'я'},
  {s:'you', p:'your', o:'you',  a:'pl', ru:'ты / вы'},
  {s:'he',  p:'his',  o:'him',  a:'3',  ru:'он'},
  {s:'she', p:'her',  o:'her',  a:'3',  ru:'она'},
  {s:'it',  p:'its',  o:'it',   a:'3',  ru:'оно'},
  {s:'we',  p:'our',  o:'us',   a:'pl', ru:'мы'},
  {s:'they',p:'their',o:'them', a:'pl', ru:'они'}
];
/* # — пропуск, %verb% — глагол, который согласуется с местоимением */
const PT = [
  {k:'s', x:'# %live% in a big city.',        no:['it']},
  {k:'s', x:'# %work% at a hospital.',        no:['it']},
  {k:'s', x:'# %like% ice cream.',            no:['it']},
  {k:'s', x:'# %go% to school every day.',    no:['it']},
  {k:'s', x:'# %speak% English very well.',   no:['it']},
  {k:'s', x:'# %have% a new phone.',          no:['it']},
  {k:'s', x:'# %play% football on Sundays.',  no:['it']},
  {k:'s', x:'# %want% to go home.',           no:['it']},
  {k:'s', x:'# %be% very tired today.'},
  {k:'s', x:'# %be% my best friend.',       only:['you','he','she']},
  {k:'s', x:'# %be% always late.'},
  {k:'s', x:'# %read% books in English.',     no:['it']},
  {k:'p', x:'This is # sister.',              no:['it']},
  {k:'p', x:'# car is very old.',             no:['it']},
  {k:'p', x:'I like # new phone.',            no:['it']},
  {k:'p', x:'# parents live in London.',      no:['it']},
  {k:'p', x:'Is this # book?',                no:['it']},
  {k:'p', x:'We visited # house last week.',  no:['it']},
  {k:'p', x:'# friends are very nice.',       no:['it']},
  {k:'p', x:'He forgot # keys at home.',      no:['it']},
  {k:'p', x:'# room is on the second floor.', no:['it']},
  {k:'p', x:'The dog wants # ball.'},
  {k:'p', x:'# teacher is very strict.',      no:['it']},
  {k:'p', x:'Where are # glasses?',           no:['it']},
  {k:'p', x:'The cat is washing # face.',     only:['it']},
  {k:'o', x:'Please help #.',                 no:['it'], subj:'you'},
  {k:'o', x:'I saw # yesterday.',                        subj:'I'},
  {k:'o', x:'Can you call # tomorrow?',       no:['it'], subj:'you'},
  {k:'o', x:'She gave # a present.',          no:['it'], subj:'-'},
  {k:'o', x:'Look at #!',                                subj:'you'},
  {k:'o', x:'Tom is waiting for #.',          no:['it'], subj:'-'},
  {k:'o', x:'Listen to # carefully.',         no:['it'], subj:'you'},
  {k:'o', x:'This letter is for #.',          no:['it'], subj:'-'},
  {k:"o", x:"Don't tell # about the party.",  no:['it'], subj:'you'},
  {k:'o', x:'My father drove # to school.',   no:['it'], subj:'-'},
  {k:'o', x:'The teacher asked # a question.',no:['it'], subj:'-'},
  {k:'o', x:'Come with #, please.',           no:['it'], subj:'you'},
  {k:"o", x:"I don't know #.",                           subj:'I'}
];
const PK_RU = {s:'подлежащее', p:'притяжательное', o:'дополнение'};

function conj(base, agr){
  if(base==='be')   return agr==='i' ? 'am' : agr==='3' ? 'is' : 'are';
  if(base==='have') return agr==='3' ? 'has' : 'have';
  return agr==='3' ? thirdPerson(base) : base;
}
/* Дополнение не может указывать на то же лицо, что и подлежащее: там нужно
   возвратное (help yourself, I saw myself), а тренажёр их не спрашивает.
   'you' стоит и у повелительного наклонения — подлежащее там подразумевается.
   Пересечение, а не равенство: «I saw us» ломается ровно так же, как «I saw me».
   У третьего лица запрета нет — «She gave her a present» про двух разных. */
const SAME_REF = {I:['I','we'], we:['I','we'], you:['you']};
function pronPool(tpl){
  const ban = (tpl.k === 'o' && SAME_REF[tpl.subj]) || [];
  return PRON.filter(p => (tpl.only ? tpl.only.includes(p.s) : !(tpl.no||[]).includes(p.s))
                       && ban.indexOf(p.s) < 0);
}
function makePronounItem(tplIn, prIn){
  const tpl = tplIn || pick(PT);
  const pr  = prIn  || pick(pronPool(tpl));
  const ans = tpl.k==='s' ? pr.s : tpl.k==='p' ? pr.p : pr.o;
  const text = tpl.x.replace(/%(\w+)%/g, (_,v)=>conj(v, pr.a));
  const i = text.indexOf('#');
  const before = text.slice(0,i), after = text.slice(i+1);
  const shown = before.trim() === '' ? cap(ans) : ans;   /* пропуск в начале предложения */

  let note = tpl.k==='s' ? 'Подлежащее (кто? что?) — личная форма: <b>'+pr.s+'</b>.'
           : tpl.k==='p' ? 'Перед существительным (чей?) — притяжательная форма: '+pr.s+' → <b>'+pr.p+'</b>.'
           : 'После глагола или предлога (кого? кому?) — объектная форма: '+pr.s+' → <b>'+pr.o+'</b>.';
  if(ans==='its')  note += ' <b>its</b> пишется без апострофа; <b>it\'s</b> = it is.';
  if(ans==='her')  note += ' У <b>her</b> совпадают притяжательная и объектная формы.';
  if(ans==='you')  note += ' У <b>you</b> личная и объектная формы одинаковы.';
  if(ans==='his')  note += ' <b>his</b> — и «его» перед существительным, и «его» отдельно.';

  return {topic:'pronoun', tag:'Местоимения · '+PK_RU[tpl.k], label:'Местоимения', sk:['p:'+tpl.k],
    dx:{kind:'pron', k:tpl.k, pr:pr},
    parts:[T(before), B([shown], pr.ru), T(after)], note};
}

function articleFrom(src, sk){
  const [raw, note] = src.split('|');
  const parts = [];
  raw.split('~').forEach((chunk,k)=>{
    if(k%2===0){ if(chunk) parts.push(T(chunk)); }
    else parts.push(B([chunk], ''));
  });
  return {topic:'article', tag:'Артикли', label:'Артикли', sk:[sk], parts, note,
          ph:'Если артикль не нужен — поставь дефис «-».'};
}
function makeArticleItem(i){ return articleFrom(ART[i], 'a:' + i); }
function makeArticleGen(){ const r = pick(ART_RULES); return articleFrom(r.make(), 'ar:' + r.id); }

/* ==================================================================
   4. Поток заданий
   ================================================================== */
function sig(it){ return it.parts.map(p=>p.t==='text'?p.v:'□').join(''); }

const TOPIC_W = {verb:3, article:1.1, pronoun:1.1};   /* основной упор — глаголы */
function pickTopic(list){
  let sum = 0; list.forEach(t => sum += TOPIC_W[t]);
  let r = Math.random()*sum;
  for(const t of list){ r -= TOPIC_W[t]; if(r <= 0) return t; }
  return list[list.length-1];
}
function makeTopicItem(topic, cfg){
  return topic==='verb' ? makeVerbItem(cfg)
       : topic==='article' ? (Math.random() < 0.5 ? makeArticleGen() : makeArticleItem(rnd(ART.length)))
       : makePronounItem();
}
function buildItem(cfg, recent){
  let it;
  for(let tries=0; tries<24; tries++){
    it = makeTopicItem(pickTopic(cfg.topics), cfg);
    if(recent.indexOf(sig(it)) < 0) return it;
  }
  return it;
}

/* полный текст с подставленными ответами */
function fullText(it){
  return it.parts.map(p => p.t==='text' ? p.v : (p.a[0]==='-' ? '' : p.a[0]))
          .join('').replace(/\s+([.,!?])/g,'$1').replace(/\s{2,}/g,' ').trim();
}

/* ==================================================================
   5. Проверка ответа
   ================================================================== */
const ZERO = ['-','–','—','−','x','х','0','zero','no','none','нет','ноль','нуль'];
function norm(s){
  return String(s).toLowerCase()
    .replace(/[’‘ʼ`´]/g,"'")
    .replace(/\s+/g,' ').trim().replace(/[.!?]+$/,'');
}
function normAns(s){
  const n = norm(s);
  return ZERO.indexOf(n) >= 0 ? '-' : n;
}
function isRight(input, blank){
  const a = normAns(input);
  return blank.a.some(x => normAns(x) === a);
}
/* тот же ответ, но без апострофа или слитно — подскажем, что именно потерялось */
const bare = s => normAns(s).replace(/['\s]/g,'');
function isNearMiss(input, blank){
  return !isRight(input, blank) && blank.a.some(x => bare(x) === bare(input));
}

    $('stStreakWrap').classList.toggle('hot', st.streak >= 5);
  }
  function renderLog(){
    $('logCount').textContent = st.mistakes.length;
    $('log').hidden = st.mistakes.length === 0;
    $('logList').innerHTML = st.mistakes.slice().reverse().map(m =>
      '<li data-topic="'+esc(m.topic)+'"><div class="s">'+m.html+'</div><div class="yours">твой ответ: <s>'+esc(m.your)+'</s> · '+m.note+'</div></li>'
    ).join('');
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  /* ---- отрисовка задания ---- */
  const sentence = $('sentence'), fb = $('fb'), primary = $('primary'), reveal = $('reveal');
  const drill = $('drill'), result = $('result'), steps = $('steps');
  let inputs = [];
  const MAX_TRIES = 3;

  function clearTimer(){ if(st.timer){ clearTimeout(st.timer); st.timer = 0; } }

  /* ---- полоса раунда: каждый шаг — одно задание ---- */
  function renderSteps(){
    const len = cfg.round || 0, m = st.round.marks;
    let html = '';
    if(len){
      for(let i = 0; i < len; i++){
        const v = m[i];
        html += '<i class="' + (v === 1 ? 'ok' : v === 0 ? 'bad' : i === st.round.idx ? 'now' : '') + '"></i>';
      }
    }else{
      m.slice(-19).forEach(v => { html += '<i class="' + (v === 1 ? 'ok' : 'bad') + '"></i>'; });
      html += '<i class="now"></i>';
    }
    steps.innerHTML = html;
  }

  /* ---- следующее задание: сначала вернувшаяся ошибка, потом новое ----
     Два призрака подряд не идут. Без этого правила при частых ошибках
     очередь становится due целиком и сессия вырождается в карусель:
     при сплошном провале на 90 заданий приходилось 7 разных. */
  function nextItem(){
    const due = (has('ghosts') && !st.lastGhost) ? st.ghosts.findIndex(g => g.due <= st.seq) : -1;
    if(due >= 0){
      const g = st.ghosts.splice(due, 1)[0];
      g.item.ghost = true;
      st.lastGhost = true;
      return g.item;
    }
    st.lastGhost = false;
    const it = buildItem(cfg, st.recent);
    st.recent.push(sig(it));
    if(st.recent.length > 30) st.recent.shift();
    return it;
  }

  function next(){
    clearTimer();
    if(cfg.round && st.round.idx >= cfg.round) return showResult();
    st.item = nextItem();
    st.attempt = 0;
    render();
  }

  function render(){
    const it = st.item;
    sentence.innerHTML = '';
    inputs = [];
    const nBlanks = it.parts.filter(p => p.t === 'blank').length;
    it.parts.forEach(p=>{
      if(p.t === 'text'){ sentence.appendChild(document.createTextNode(p.v)); return; }
      const inp = document.createElement('input');
      inp.type = 'text'; inp.className = 'blank';
      inp.lang = 'en'; inp.dir = 'ltr';                  /* поле английское, страница русская */
      inp.autocomplete = 'off'; inp.autocapitalize = 'off'; inp.spellcheck = false;
      inp.setAttribute('autocorrect','off');
      inp.setAttribute('enterkeyhint','go');             /* на телефоне кнопка ввода, а не «ввод» */
      inp.setAttribute('data-1p-ignore','');             /* менеджеры паролей рисуют свою иконку в пропуске */
      inp.setAttribute('data-lpignore','true');
      inp.setAttribute('data-form-type','other');
      inp.setAttribute('aria-label', nBlanks > 1 ? 'пропуск ' + (inputs.length + 1) : 'пропуск');
      sentence.appendChild(inp);
      inputs.push({el: inp, b: p});
      if(p.hint){
        const h = document.createElement('span');
        h.className = 'hint';
        h.textContent = ' (' + p.hint + ')';
        sentence.appendChild(h);
      }
    });
    const bands = document.querySelector('.bands');
    bands.classList.add('reset');                 /* сброс полос без проигрывания */
    document.body.dataset.topic = it.topic;
    delete document.body.dataset.verdict;
    void bands.offsetWidth;
    bands.classList.remove('reset');
    $('subhint').hidden = !it.ph;
    $('subhint').textContent = it.ph || '';
    fb.innerHTML = '';
    primary.textContent = 'Проверить';
    reveal.hidden = false;
    st.checked = false;
    renderSteps();
    if(panel.hidden) focusFirst();     /* иначе панель непроходима табом */
  }
  function focusFirst(){ if(inputs[0]) inputs[0].el.focus(); }

  /* правильное предложение с подсвеченными ответами */
  function answerHTML(it){
    return it.parts.map(p => p.t === 'text' ? esc(p.v)
      : (p.a[0] === '-' ? '<span class="fill zero" title="без артикля"></span>'
                        : '<span class="fill">' + esc(p.a[0]) + '</span>'))
      .join('').replace(/\s+([.,!?])/g,'$1');
  }

  /* ---- подсветить маркер: показать, куда смотреть, не называя время ---- */
  function markMarker(mark){
    if(!mark) return;
    const nodes = Array.prototype.filter.call(sentence.childNodes, n => n.nodeType === 3);
    for(let i = 0; i < nodes.length; i++){
      const at = nodes[i].nodeValue.indexOf(mark);
      if(at < 0) continue;                       /* уже подсвечен — второй раз не оборачиваем */
      const tail = nodes[i].splitText(at);
      tail.splitText(mark.length);
      const box = document.createElement('span');
      box.className = 'mk';
      box.textContent = mark;
      tail.parentNode.replaceChild(box, tail);
      return;
    }
  }

  /* ---- лестница подсказок вместо «подумай ещё раз» ----
     Ступень 1 — куда смотреть. Ступень 2 — что за форму человек написал,
     названная маркерами: метка времени до конца попыток не появляется. */
  function ladder(it, wrong, attempt){
    const dx = it.dx;
    if(!dx) return 'Подумай ещё раз. ';
    const typed = wrong[0] ? wrong[0].el.value : '';

    if(dx.kind === 'pron'){
      const hits = diagnosePron(typed, dx);
      if(hits.length === 1 && hits[0] !== dx.k)
        return 'Ты написал ' + PK_HINT[hits[0]] + '. Здесь нужна другая. ';
      return 'Спроси себя, на какой вопрос отвечает пропуск: «кто?», «чей?» или «кого / кому?». ';
    }

    if(attempt === 1){
      markMarker(it.marker);
      return 'Время задаёт <b>' + esc(it.marker) + '</b> — посмотри на него ещё раз. ';
    }
    const hits = diagnoseVerb(typed, dx);
    if(hits.length === 1){
      if(hits[0].tense !== dx.tense){
        const ex = markerHints(dx, hits[0].tense);
        if(ex.length){
          markMarker(it.marker);
          return 'Так пишут с <b>' + esc(ex[0]) + '</b>'
               + (ex[1] ? ' или <b>' + esc(ex[1]) + '</b>' : '')
               + ', а здесь маркер — <b>' + esc(it.marker) + '</b>. ';
        }
      }else if(hits[0].form !== dx.form){
        return 'Время верное, а форма — нет: здесь ' + FORM_RU[dx.form] + '. ';
      }
    }
    markMarker(it.marker);
    return 'Ещё раз: время задаёт <b>' + esc(it.marker) + '</b>. ';
  }

  /* ---- итог задания: считаем один раз, засчитываем только первую попытку ---- */
  function settle(it, firstTry){
    st.total++;
    st.seq++;
    st.round.idx++;
    st.round.marks.push(firstTry ? 1 : 0);
    if(firstTry){ st.correct++; st.streak++; } else { st.streak = 0; }
    const key = it.label;
    const s = st.round.by[key] || (st.round.by[key] = {n:0, ok:0});
    s.n++; if(firstTry) s.ok++;
    /* Предохранитель: задание, которое не далось трижды, откладывается.
       Четвёртый показ ничему не учит — у каждого показа уже три попытки
       и полный разбор, — а место в очереди занимает. */
    if(!firstTry && has('ghosts')){
      const k = sig(it);
      st.lapses[k] = (st.lapses[k] || 0) + 1;
      if(st.lapses[k] >= 3 || st.ghosts.length >= 8) st.round.parked++;
      else st.ghosts.push({item: it, due: st.seq + 3 + rnd(4)});
    }
    renderStats(); renderSteps();
  }

  function check(force){
    if(st.checked){ return next(); }
    const it = st.item;
    if(!force){
      const empty = inputs.find(x => !x.el.value.trim());
      if(empty){
        empty.el.classList.remove('empty'); void empty.el.offsetWidth; empty.el.classList.add('empty');
        empty.el.focus();
        return;
      }
    }
    let ok = true, nearFix = '';
    const wrong = [];
    inputs.forEach(x=>{
      const good = !force && isRight(x.el.value, x.b);
      if(!good && !force && !nearFix && isNearMiss(x.el.value, x.b)) nearFix = x.b.a[0];
      if(!good){ ok = false; wrong.push(x); }
      x.el.classList.toggle('ok', good);
    });

    const tag = (it.ghost ? '<span class="mark-v gh">Повтор</span>' : '')
              + '<span class="tag">' + esc(it.tag) + '</span>';
    const nearNote = nearFix ? '<b>Почти!</b> Форма верная, но написана неточно — нужно <b>'
                               + esc(nearFix) + '</b> (апостроф и пробелы важны). ' : '';
    /* пока попытки не кончились, называем характер расхождения, но не саму форму:
       иначе первая же опечатка выдаёт ответ и три попытки теряют смысл */
    const nearHint = nearFix ? '<b>Почти!</b> Форма верная, ошибка только в записи — проверь апостроф и пробелы. ' : '';

    /* --- ещё есть попытки: ответ не показываем --- */
    if(!ok && !force && st.attempt < MAX_TRIES - 1){
      st.attempt++;
      const left = MAX_TRIES - st.attempt;
      wrong.forEach(x=>{ x.el.classList.remove('ok'); x.el.classList.add('retry'); });
      inputs.forEach(x=>{ if(x.el.classList.contains('ok')) x.el.disabled = true; });
      fb.innerHTML = '<div class="verdict"><span class="mark-v try">Не то</span>'
        + '<p class="note">' + (nearHint || ladder(it, wrong, st.attempt))
        + (left === 1 ? 'Осталась одна попытка' : 'Осталось ' + left + ' попытки') + '.</p></div>';
      const first = wrong[0];
      first.el.focus(); first.el.select();
      return;
    }

    /* --- задание закрыто --- */
    inputs.forEach(x=>{
      x.el.classList.remove('retry');
      if(!x.el.classList.contains('ok')) x.el.classList.add('bad');
      x.el.disabled = true;
    });
    const firstTry = ok && st.attempt === 0 && !force;
    document.body.dataset.verdict = ok ? 'ok' : 'bad';
    st.checked = true;
    settle(it, firstTry);

    if(firstTry){
      /* знал сразу — читать нечего, идём дальше сами */
      fb.innerHTML = '<div class="verdict"><span class="mark-v ok">Верно</span></div>';
      primary.textContent = 'Дальше';
      reveal.hidden = true;
      if(has('autonext')){ st.timer = setTimeout(next, 700); }
      else primary.focus();
      return;
    }

    const html = answerHTML(it);
    if(ok){
      fb.innerHTML = '<div class="verdict"><span class="mark-v ok">Верно, со ' + (st.attempt + 1) + '-й попытки</span>'
        + tag + '<p class="note">' + nearNote + it.note + '</p></div>';
    }else{
      fb.innerHTML = '<div class="verdict"><span class="mark-v bad">Ошибка</span>'
        + '<p class="answer">' + html + '</p>' + tag + '<p class="note">' + nearNote + it.note + '</p></div>';
      const your = inputs.map(x => x.el.value.trim() || '…').join(' / ');
      st.mistakes.push({html: html, your: your, topic: it.topic,
                        note: (nearNote + it.note).replace(/<[^>]+>/g,'')});
      renderLog();
    }
    primary.textContent = 'Дальше';
    reveal.hidden = true;
    primary.focus();
  }

  /* ---- итог раунда ---- */
  function showResult(){
    const r = st.round;
    const acc = r.idx ? Math.round(r.marks.filter(m=>m===1).length / r.idx * 100) : 0;
    const rows = Object.keys(r.by).map(k=>({k, ...r.by[k]}))
      .sort((a,b)=> (a.ok/a.n) - (b.ok/b.n)).slice(0, 5);
    const verdict = acc >= 90 ? 'ok' : acc >= 60 ? 'try' : 'bad';
    result.innerHTML =
      '<p class="rbig"><b>' + r.marks.filter(m=>m===1).length + '</b> из ' + r.idx + '</p>'
      + '<span class="mark-v ' + verdict + '">' + acc + '% с первой попытки</span>'
      + (rows.length ? '<ul class="rbreak">' + rows.map(x =>
          '<li><span>' + esc(x.k) + '</span><b>' + x.ok + ' / ' + x.n + '</b>'
          + '<i style="--p:' + Math.round(x.ok/x.n*100) + '%"></i></li>').join('') + '</ul>' : '')
      + (st.ghosts.length ? '<p class="note">Ошибки, которые ещё не закрыты: ' + st.ghosts.length
         + '. Они вернутся в следующем раунде.</p>' : '')
      + (r.parked ? '<p class="note">Отложено: ' + r.parked
         + '. Эти задания не пошли с трёх подходов — тренажёр перестал их возвращать, '
         + 'чтобы раунд не превратился в карусель.</p>' : '')
      + '<div class="actions"><button class="btn" id="again">Ещё раунд</button></div>';
    drill.hidden = true; result.hidden = false;
    $('again').addEventListener('click', startRound);
    $('again').focus();
  }

  function startRound(){
    clearTimer();
    st.round = {idx:0, marks:[], by:{}, parked:0};
    drill.hidden = false; result.hidden = true;
    renderStats();
    next();
  }

  primary.addEventListener('click', ()=> check(false));
  reveal.addEventListener('click', ()=> check(true));

  document.addEventListener('keydown', e=>{
    if(e.key === 'Escape' && !panel.hidden){ e.preventDefault(); closePanel(true); return; }
    if(e.key !== 'Enter') return;
    if(!result.hidden){ e.preventDefault(); startRound(); return; }
    if(e.ctrlKey || e.metaKey){ if(!st.checked) check(true); e.preventDefault(); return; }
    const tn = e.target.tagName;   /* белый список: всё прочее (summary, чипы, ссылки) Enter не трогает */
    if(tn !== 'INPUT' && tn !== 'BODY' && e.target !== primary) return;
    e.preventDefault();
    check(false);
  });

  renderStats(); renderLog(); startRound();
}

/* ==================================================================
   7. Самопроверка движка: index.html#test
   ================================================================== */
function selfTest(){
  const out = [];
  const eq = (a,b,m) => { if(a!==b) out.push('FAIL '+m+': "'+a+'" ≠ "'+b+'"'); };
  eq(thirdPerson('go'),'goes','go'); eq(thirdPerson('do'),'does','do');
  eq(thirdPerson('study'),'studies','study'); eq(thirdPerson('play'),'plays','play');
  eq(thirdPerson('watch'),'watches','watch'); eq(thirdPerson('fix'),'fixes','fix');
  eq(thirdPerson('miss'),'misses','miss'); eq(thirdPerson('carry'),'carries','carry');
  eq(thirdPerson('enjoy'),'enjoys','enjoy'); eq(thirdPerson('teach'),'teaches','teach');
  eq(pastRegular('stop',1),'stopped','stop'); eq(pastRegular('study'),'studied','study');
  eq(pastRegular('enjoy'),'enjoyed','enjoy'); eq(pastRegular('like'),'liked','like');
  eq(pastRegular('travel',1),'travelled','travel'); eq(pastRegular('watch'),'watched','watch');
  eq(pastRegular('cry'),'cried','cry'); eq(pastRegular('plan',1),'planned','plan');
  eq(ingForm('make'),'making','make'); eq(ingForm('see'),'seeing','see');
  eq(ingForm('sit',1),'sitting','sit'); eq(ingForm('study'),'studying','study');
  eq(ingForm('dance'),'dancing','dance'); eq(ingForm('begin',1),'beginning','begin');
  eq(ingForm('play'),'playing','play'); eq(ingForm('travel',1),'travelling','travel');
  eq(ingForm('forget',1),'forgetting','forget'); eq(ingForm('carry'),'carrying','carry');
  eq(ingForm('write'),'writing','write'); eq(ingForm('lose'),'losing','lose');
  eq(affAnswers(['is','going']).join('|'),"is going|'s going",'affAnswers');
  eq(negAnswers(['has','gone']).join('|'),"hasn't gone|has not gone|'s not gone",'negAnswers');
  eq(negAnswers(['am','going']).join('|'),"'m not going|am not going",'negAnswers am');
  VERBS.forEach(v=>{
    if(v.pp && v.pp === (v.p || pastRegular(v.b, v.dbl))) out.push('лишнее pp у '+v.b);
    if(!v.p && v.pp) out.push('pp у правильного глагола '+v.b);
    if(v.noCont && v.dur) out.push('противоречие noCont+dur: '+v.b);
  });
  /* --- маркер времени обязан называть ровно одно время --- */
  /* какие времена вообще достижимы для этого глагола — точно по makeVerbItem */
  const reachable = (v, t) => isPerfCont(t) ? !!v.dur
                            : isCont(t)     ? (!v.noCont && !v.st)
                            : (t === 'pastP' || t === 'futP') ? !v.noPerf
                            : true;
  const markerSet = (v, t, be) => be ? (MARK_BE[t] || [])
                                     : (v.st && MARK_ST[t]) ? MARK_ST[t] : (MARK[t] || []);
  const ambig = {};
  const collect = (v, tenses, be, who) => {
    const m2t = {};
    tenses.forEach(t=>{
      if(!be && !reachable(v, t)) return;
      markerSet(v, t, be).forEach(m=>{ (m2t[m] || (m2t[m] = [])).push(t); });
    });
    Object.keys(m2t).forEach(m=>{
      if(m2t[m].length > 1) ambig['«' + m + '» → ' + m2t[m].join(' / ') + '  (' + who + ')'] = 1;
    });
  };
  VERBS.forEach(v => collect(v, TENSES_ALL, false, v.b));
  collect({}, BE_TENSES, true, 'be');
  Object.keys(ambig).forEach(k => out.push('FAIL маркер не однозначен: ' + k));

  /* --- разбор обязан узнавать форму, которую написал ученик --- */
  VERBS.slice(0, 20).forEach(v=>{
    ['i','3','pl'].forEach(agr=>{
      TENSES_ALL.forEach(t=>{
        const p = phraseFor(v, t, agr);
        if(!p) return;
        const dx = {kind:'verb', be:false, v:v, agr:agr, tense:t, form:'aff'};
        [['aff', affAnswers(p.aff)],
         ['neg', p.doAux ? negAnswers([p.doAux].concat(p.base)) : negAnswers(p.aff)]].forEach(pair=>{
          pair[1].forEach(ans=>{
            if(!diagnoseVerb(ans, dx).some(h => h.tense === t && h.form === pair[0]))
              out.push('FAIL разбор не узнал свою же форму: ' + v.b + ' ' + t + '/' + pair[0] + ' → "' + ans + '"');
          });
        });
      });
    });
  });
  BE_TENSES.forEach(t=>{
    ['i','3','pl'].forEach(agr=>{
      const p = bePhraseFor(t, agr);
      const dx = {kind:'verb', be:true, v:null, agr:agr, tense:t, form:'aff'};
      affAnswers(p.aff).forEach(ans=>{
        if(!diagnoseVerb(ans, dx).some(h => h.tense === t && h.form === 'aff'))
          out.push('FAIL разбор не узнал форму be: ' + t + ' → "' + ans + '"');
      });
    });
  });
  if(diagnoseVerb('zzz', {kind:'verb', be:false, v:VERBS[0], agr:'3'}).length) out.push('FAIL разбор узнал мусор');
  if(diagnoseVerb('',    {kind:'verb', be:false, v:VERBS[0], agr:'3'}).length) out.push('FAIL разбор узнал пустое');
  PRON.forEach(pr=>{
    ['s','p','o'].forEach(k=>{
      if(diagnosePron(pr[k], {pr:pr}).indexOf(k) < 0) out.push('FAIL разбор не узнал местоимение ' + pr[k]);
    });
  });
  /* Возвратные формы тренажёр не спрашивает, значит и поводов для них быть
     не должно. Проверка идёт по готовой строке и не знает про SAME_REF:
     подлежащее в тексте видно, поэтому таблицу можно не спрашивать.
     У повелительного наклонения подлежащего в строке нет — оно дописывается
     из subj, и тогда проверка работает и там. */
  const REFL = [
    [/\bI\b/,   /\b(me|us)\b/,  'I … me/us'],
    [/\bWe\b/i, /\b(me|us)\b/,  'we … me/us'],
    [/\byou\b/i,/\byou\b.*\byou\b/i, 'you … you']
  ];
  PT.forEach(tpl=>{
    if(tpl.k === 'o' && !tpl.subj)
      out.push('FAIL объектный шаблон без подлежащего: «' + tpl.x + '»');
    if(!pronPool(tpl).length)
      out.push('FAIL шаблону нечего подставить: «' + tpl.x + '»');
  });
  /* подсказка в скобках не имеет права быть ответом: перебираем все пары */
  PT.forEach(tpl=>{
    pronPool(tpl).forEach(pr=>{
      const it = makePronounItem(tpl, pr);
      const txt = it.parts.map(p => p.t === 'text' ? p.v : p.a[0]).join('');
      const probe = (tpl.subj && tpl.subj !== '-' && !new RegExp('\\b' + tpl.subj + '\\b','i').test(tpl.x))
                  ? tpl.subj + ' ' + txt : txt;
      REFL.forEach(r=>{
        const bad = r[2] === 'you … you' ? r[1].test(probe) : (r[0].test(probe) && r[1].test(probe));
        if(bad) out.push('FAIL нужна возвратная форма (' + r[2] + '): «' + txt + '»');
      });
      it.parts.forEach(p=>{
        if(p.t !== 'blank') return;
        const где = '"' + p.a[0] + '" в «' + tpl.x + '»';
        if(!p.hint) out.push('FAIL пропуск без подсказки: ' + где);
        else if(/[A-Za-z]/.test(p.hint))
          out.push('FAIL подсказка по-английски — так она выдаёт форму: ' + где + ' (' + p.hint + ')');
        else if(normAns(p.hint) === normAns(p.a[0]))
          out.push('FAIL подсказка совпала с ответом: ' + где);
      });
    });
  });
  /* маркеры-примеры для ошибочного времени обязаны существовать */
  TENSES_ALL.forEach(t=>{
    if(!markerHints({be:false, v:VERBS[0]}, t).length) out.push('FAIL нет маркеров-примеров для ' + t);
  });

  /* --- генератор артиклей: каждое правило обязано давать целое задание --- */
  ART_RULES.forEach(r=>{
    const notes = {};
    for(let i=0;i<120;i++){
      const src = r.make();
      if(src.split('|').length !== 2){ out.push('FAIL правило ' + r.id + ': нет разбора'); break; }
      if((src.split('|')[0].split('~').length - 1) % 2){ out.push('FAIL правило ' + r.id + ': непарный ~'); break; }
      const it = articleFrom(src, 'ar:' + r.id);
      const txt = it.parts.map(p => p.t === 'text' ? p.v : '□').join('');
      if(!it.parts.some(p => p.t === 'blank')) { out.push('FAIL правило ' + r.id + ': нет пропуска'); break; }
      if(!it.note)                             { out.push('FAIL правило ' + r.id + ': пустой разбор'); break; }
      if(/\s\s|\s[.,!?]/.test(txt))            { out.push('FAIL правило ' + r.id + ': пробелы — "' + txt + '"'); break; }
      if(/[#~%]/.test(txt))                    { out.push('FAIL правило ' + r.id + ': шаблон не раскрыт'); break; }
      let bad = '';
      it.parts.forEach(p=>{ if(p.t === 'blank' && ['a','an','the','The','-'].indexOf(p.a[0]) < 0) bad = p.a[0]; });
      if(bad){ out.push('FAIL правило ' + r.id + ': не артикль в ответе — "' + bad + '"'); break; }
      notes[it.note] = 1;
    }
    if(!Object.keys(notes).length) out.push('FAIL правило ' + r.id + ': ничего не собрало');
  });
  /* --- a / an ставится по звуку, но расхождение с буквой обязано быть осознанным --- */
  const AN_EXC = {hour:1, honest:1, honour:1, heir:1, umbrella:1,
                  university:0, uniform:0, useful:0, european:0, one:0, unit:0, user:0, unique:0};
  [A_PROF, A_THING].forEach(list=>{
    list.forEach(n=>{
      const first = n.w.toLowerCase().split(' ')[0];
      const listed = first in AN_EXC;
      /* у слов на u и eu звук не выводится из буквы (umbrella [ʌ] → an, university [ju] → a),
         поэтому такие слова обязаны стоять в AN_EXC явно, а не по умолчанию */
      if(/^(u|eu)/.test(first) && !listed){
        out.push('FAIL a/an у «' + n.w + '»: слово на u — звук по букве не угадывается, впиши его в AN_EXC');
        return;
      }
      const want = listed ? !!AN_EXC[first] : /^[aeiou]/.test(first);
      if(!!n.an !== want)
        out.push('FAIL a/an у «' + n.w + '»: флаг an=' + (n.an ? 1 : 0) + ', ожидается ' + (want ? 1 : 0)
                 + ' (если это исключение по звуку — впиши его в AN_EXC)');
    });
  });

  const cfg = {topics:['verb','article','pronoun'], tenses:TENSES_ALL.slice(), forms:['aff','neg','q']};
  for(let i=0;i<8000;i++){
    const it = buildItem(cfg, []);
    const txt = it.parts.map(p=>p.t==='text'?p.v:'□').join('');
    if(/[#~%]/.test(txt)) out.push('FAIL шаблон не раскрыт: '+txt);
    if(/\s\s|\s[.,!?]/.test(txt)) out.push('FAIL пробелы: "'+txt+'"');
    if(!it.parts.some(p=>p.t==='blank')) out.push('FAIL нет пропуска: '+txt);
    it.parts.forEach(p=>{ if(p.t==='blank' && (!p.a.length || !p.a[0])) out.push('FAIL пустой ответ: '+txt); });
    if(!it.note) out.push('FAIL нет пояснения: '+txt);
    if(!it.label) out.push('FAIL нет label: '+txt);
    if(!it.sk || !it.sk.length || it.sk.some(k => !k || /undefined|null/.test(k)))
      out.push('FAIL плохой sk: ' + JSON.stringify(it.sk) + ' — ' + txt);
  }
  ART.forEach((s,i)=>{
    if(s.split('|').length!==2) out.push('FAIL артикль без пояснения #'+i);
    if((s.split('~').length-1)%2) out.push('FAIL непарный ~ #'+i);
    const it = makeArticleItem(i);
    if(!it.parts.some(p=>p.t==='blank')) out.push('FAIL артикль без пропуска #'+i);
    if(it.sk[0] !== 'a:'+i) out.push('FAIL sk артикля #'+i);
  });
  return out;
}

if(typeof document !== 'undefined'){
  boot();
  if(location.hash === '#test'){
    const r = selfTest();
    console.log(r.length ? r : 'Все проверки пройдены');
    alert(r.length ? r.slice(0,10).join('\n') : 'Все проверки пройдены');
  }
}
